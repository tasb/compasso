product:
  name: Clinic Booking
  brief: .compasso/product/brief.md
  sources: [ideas, documents, issues]
  prototype: null
features:
  - {key: F-0, title: Walking skeleton, goal: "The app, its database and CI running end to end, deployed to staging", scope: [Next.js app, Postgres, CI pipeline, staging deploy], acceptance: ["Given a push to main, When the pipeline passes, Then staging serves the health page"], size_h: 16, mvp: true, depends_on: [], sensitive: false, sources: [idea], gitlab: 2}
  - {key: F-1, title: Staff sign-in and working hours, goal: Staff sign in and each therapist sets the hours they take appointments, scope: [Staff sign-in, Working hours per therapist, Closed days], acceptance: ["Given a therapist, When they set Monday 9:00-13:00, Then patients see Monday morning slots for them", "Given a closed day, When a patient looks at that day, Then no slot is offered"], size_h: 24, mvp: true, depends_on: [F-0], sensitive: true, sources: [idea, "#1"], gitlab: 3}
  - {key: F-2, title: Book an appointment, goal: "A patient books a free slot from a phone, confirming their email", scope: [Free slots by therapist and day, Booking form, Email confirmation, No double booking], acceptance: ["Given a free slot, When a patient books it and confirms the email, Then the slot is taken and both sides see it", "Given two patients booking the same slot at once, When both submit, Then only one booking exists"], size_h: 32, mvp: true, depends_on: [F-1], sensitive: true, sources: ["#1", prototype], gitlab: 4}
  - {key: F-3, title: Staff calendar, goal: Reception runs the day from one calendar and books for patients who call, scope: [Day and week view, Book on behalf of a patient, Mark as attended or missed], acceptance: ["Given 12 appointments today, When reception opens the calendar, Then it shows them by therapist and hour"], size_h: 24, mvp: true, depends_on: [F-2], sensitive: true, sources: [documents], gitlab: 5}
  - {key: F-4, title: Email reminders, goal: Patients get a reminder the day before, with a link to cancel, scope: [Reminder 24h before, Cancel link], acceptance: ["Given an appointment tomorrow at 10:00, When the reminder job runs today, Then the patient gets one email with a cancel link"], size_h: 16, mvp: true, depends_on: [F-2], sensitive: false, sources: ["#2"], gitlab: 6}
  - {key: F-5, title: Cancel and reschedule, goal: Patients move or cancel their own appointment up to 24h before, scope: [Cancel, Move to another free slot, 24h rule], acceptance: ["Given an appointment in 3 days, When the patient moves it to a free slot, Then the old slot is free again"], size_h: 24, mvp: true, depends_on: [F-2], sensitive: false, sources: ["#1"], gitlab: 7}
  - {key: F-6, title: SMS reminders, goal: Patients who prefer it get the reminder by SMS, scope: [SMS provider, Preference per patient], acceptance: ["Given a patient who chose SMS, When the reminder job runs, Then they get an SMS and no email"], size_h: 16, mvp: false, depends_on: [F-4], sensitive: false, sources: [documents], gitlab: 8}
  - {key: F-7, title: Waiting list, goal: Patients join a waiting list and are offered a slot that frees up, scope: [Join the list, Offer by email, First to confirm gets it], acceptance: ["Given a full day and a patient on its waiting list, When a slot frees up, Then the patient is offered it"], size_h: 24, mvp: false, depends_on: [F-5], sensitive: false, sources: ["#3"], gitlab: 9}
  - {key: F-8, title: Owner's monthly report, goal: "The owner sees bookings, missed appointments and online share per month", scope: [Monthly figures, Export to CSV], acceptance: ["Given a month of appointments, When the owner opens the report, Then it shows online share and missed rate"], size_h: 24, mvp: false, depends_on: [F-3], sensitive: false, sources: [documents], gitlab: 10}
