# Compasso project configuration. Written by /compasso:setup; commit it.
version: 1

tracker:
  provider: gitlab            # gitlab | github
  host: gitlab.com            # gitlab.com, github.com, or your own server
  project: ""                 # GitLab: namespace/project; GitHub: owner/repo
  tier: auto                  # GitLab only: auto | free | premium (set explicitly on self-managed)
  github:                     # GitHub only
    project: 0                # the GitHub Project (its number) that holds sprints, estimates and status; 0 for none
    fields:                   # the Project's fields, by name
      estimate: Estimate (h)
      iteration: Iteration
      status: Status
    status:                   # the Status option for each Compasso state
      new: Todo
      building: In progress
      in-review: In review
      done: Done

language: en                  # what Compasso writes for people, on the tracker and in the repository:
                              # en | pt-PT | pt-BR (templates/locales/). Labels stay in English.

sprint:
  weeks: 2
  hours_per_day: 8
  capacity_hours: 80          # team hours available per sprint, humans and agents

limits:
  story_max_hours: 8          # hard limit: one working day
  story_target_hours: 4       # what the planner aims for
  # A feature may take at most half a sprint; derived from sprint, not configured.

commands:                     # the repo's own commands; empty means "not applicable"
  test: ""
  lint: ""
  typecheck: ""
  build: ""
  e2e: ""

testing: {}                   # per language and area (unit, api, e2e, coverage, property): what the project
                              # uses, or Compasso's default where it had nothing; written by bin/test-stack.sh write
test_paths:                   # what counts as a test file: in production the tester writes them and the developer never changes them
  - "tests/**"
  - "test/**"
  - "e2e/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/test_*.py"

coverage:                     # line coverage of changed lines; below the threshold is a warning, never a block
  command: ""                 # the repo's own command; empty means "not measured"
  report: ""                  # the Cobertura or LCOV file the command writes
  min_changed: 80             # default %; an Epic, Feature or Story can override with a "**Coverage:** N%" line
  paths: []                   # product-code globs; a changed file here missing from the report counts as uncovered

ci:
  image: ""                   # the image with the repo's toolchain, for the merge request pipeline

metrics:                      # the sprint report
  prices: {}                  # optional: price per million tokens per model, e.g. { opus: 30, sonnet: 6, haiku: 2 }
  currency: USD

prototype:                    # /compasso:discover from a running web app
  image: mcr.microsoft.com/playwright:v1.55.0-noble   # the Playwright image it crawls with, tagged vX.Y.Z

approvals:
  plan: human                 # human | auto: whether a person approves the first plan (/compasso:plan) before it is pushed

stage: production             # mvp | harden | production: how much each change is checked before it merges
                              #   mvp: the pipeline's scans and the tech lead's blocker-only review; the rest goes to one after-MVP list
                              #   harden: as mvp, plus one audit of the whole code and the after-MVP list drained into stories
                              #   production: a reviewer and a security agent on every change, one rework round

run:                          # bin/run.sh, started by cron on each agent's machine: one job per run, in a fresh session
  lead_minutes: 15            # how often the tech lead wakes
  dev_minutes: 10             # how often a developer wakes
  job_minutes: 60             # the longest one job may take before it is stopped
  failures: 2                 # failed jobs on one story before a person is asked
  allow: []                   # production only: tool rules a job may use beyond the repo's commands, git, the tracker CLI and
                              # Compasso's scripts, e.g. ["Bash(make deploy-check)"]; mvp and harden jobs run without prompts

staging:                      # where people test what was delivered: a green main deploys itself there (bin/ci.sh)
  deploy: ""                  # the command that deploys main to staging, run in ci.image; empty: no deploy job
  url: ""                     # its address, given to the people who test

people:
  ask: []                     # tracker logins that get the needs::human issues, e.g. ["ana"]; none leaves them unassigned

trust:                        # who approves a story's Verify commands before they run (bin/trust.sh)
  verify_approval: false      # false: they run without asking, in every stage (unattended runs ask no one); true: a person
                              # approves each one, except those the plan on the default branch lists for that story

risk:
  sensitive_paths: []         # globs of authentication, payments, personal data: their stories get abuse cases at planning

team:                         # several agents on one project, each with a persona (bin/persona.sh)
  enabled: false              # true: a tech lead assigns every story to a named developer (dev::<name>);
                              # an agent with no persona only reads. Set by the tech lead's setup
  queue: { target: 15, min: 5 }   # the tech lead assigns a developer more stories while it has fewer than min ready
  developers: []              # the developers' names, e.g. [jobs, woz]: each gets a dev::<name> label (bin/run.sh)

harnesses: [claude]           # claude and/or codex

models:
  claude:
    planner:  { model: opus }
    tester:   { model: sonnet }
    reviewer: { model: sonnet }
    security: { model: opus }
  codex:
    planner:  { model: gpt-6-astra, effort: high }
    tester:   { model: gpt-6-sol,   effort: medium }
    reviewer: { model: gpt-6-sol,   effort: high }
    security: { model: gpt-6-astra, effort: high }
