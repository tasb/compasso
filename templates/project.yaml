# Compasso project configuration. Written by /compasso:setup; commit it.
version: 1

tracker:
  provider: gitlab            # gitlab | github
  host: gitlab.com            # gitlab.com, github.com, or your own server
  project: ""                 # GitLab: namespace/project; GitHub: owner/repo
  tier: auto                  # GitLab only: auto | free | premium (set explicitly on self-managed)
  github:                     # GitHub only
    project: 0                # the GitHub Project (its number) that holds sprints, estimates and status; 0 for none
    fields:                   # the Project's fields, by name
      estimate: Estimate (h)
      iteration: Iteration
      status: Status
    status:                   # the Status option for each Compasso state
      new: Todo
      building: In progress
      in-review: In review
      done: Done

sprint:
  weeks: 2
  hours_per_day: 8
  capacity_hours: 80          # team hours available per sprint, humans and agents
  parallel: 2                 # stories built at the same time by the sprint flow

limits:
  story_max_hours: 8          # hard limit: one working day
  story_target_hours: 4       # what the planner aims for
  # A feature may take at most half a sprint; derived from sprint, not configured.
  agent_runs:                 # strict orchestration: how many times each role may run, or be continued,
    tester: 5                 # in one flow run (a story, a plan, a review...); bin/budget.sh refuses the next one
    builder: 7
    reviewer: 3
    security: 4
    approver: 1
    shipper: 2
    mutator: 2
    total: 20                 # every role together

commands:                     # the repo's own commands; empty means "not applicable"
  test: ""
  lint: ""
  typecheck: ""
  build: ""
  e2e: ""

testing: {}                   # per language and area (unit, api, e2e, coverage, property): what the project
                              # uses, or Compasso's default where it had nothing; written by bin/test-stack.sh write
test_paths:                   # what counts as a test file: the builder may not add, change or remove these
  - "tests/**"
  - "test/**"
  - "e2e/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/test_*.py"

coverage:                     # line coverage of changed lines; below the threshold is a warning, never a block
  command: ""                 # the repo's own command; empty means "not measured"
  report: ""                  # the Cobertura or LCOV file the command writes
  min_changed: 80             # default %; an Epic, Feature or Story can override with a "**Coverage:** N%" line
  paths: []                   # product-code globs; a changed file here missing from the report counts as uncovered

ci:
  image: ""                   # the image with the repo's toolchain, for the merge request pipeline

test_guide:                   # the HTML guide business testers get at the end of a sprint
  language: en                # the language it is written in, e.g. en, pt-PT, es
  where: ""                   # where testers test: a URL, or how to reach the environment

metrics:                      # the sprint report
  prices: {}                  # optional: price per million tokens per model, e.g. { opus: 30, sonnet: 6, haiku: 2 }
  currency: USD

harden:                       # optional hardening, after the MVP (/compasso:harden)
  flaky_runs: 5               # code set: how many times the suite runs to find flaky tests
  environment:                # live set: a running test environment - never production
    url: ""                   # its base URL
    openapi: ""               # the OpenAPI schema (a URL, or a path in the repo) for API fuzzing
    disposable: false         # true: fuzzing may send requests that create or change data
    pages: []                 # UI paths to check for accessibility, e.g. ["/", "/billing"]
    endpoints: []             # GET paths for the performance smoke test, e.g. ["/invoices"]
  limits:
    p95_ms: 500               # performance: 95% of requests faster than this
    error_rate: 0.01          # performance: at most this share of requests failing
  images:                     # the Docker images the live checks run in; update them here
    zap: ghcr.io/zaproxy/zaproxy:stable
    fuzz: schemathesis/schemathesis:stable
    perf: grafana/k6:latest
    a11y: mcr.microsoft.com/playwright:v1.55.0-noble

approvals:
  plan: human                 # human | auto  (auto still requires a clean security review of the plan)
  merge: human                # human | agent | risk: low-risk changes merge automatically, the rest wait for a person
                              # (an agent never merges with an open security finding)

risk:                         # what makes a change need a person (approvals.merge: risk), abuse cases and a mutation check
  sensitive_paths: []         # globs where a change always needs a person, e.g. ["src/auth/**", "src/billing/payments/**"]
  max_changed_lines: 200      # a bigger change needs a person

harnesses: [claude]           # claude and/or codex

models:
  claude:
    planner:  { model: opus }
    tester:   { model: sonnet }
    builder:  { model: sonnet }
    reviewer: { model: sonnet }
    security: { model: opus }
    approver: { model: opus }
    shipper:  { model: haiku }
    mutator:  { model: sonnet }
  codex:
    planner:  { model: gpt-6-astra, effort: high }
    tester:   { model: gpt-6-sol,   effort: medium }
    builder:  { model: gpt-6-sol,   effort: medium }
    reviewer: { model: gpt-6-sol,   effort: high }
    security: { model: gpt-6-astra, effort: high }
    approver: { model: gpt-6-astra, effort: high }
    shipper:  { model: gpt-6-luna,  effort: low }
    mutator:  { model: gpt-6-sol,   effort: medium }
