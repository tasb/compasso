# Compasso's texts in English: the base every other language falls back to.
# md:   the names in work items on the tracker; Compasso reads them back in every language it ships.
# text: comments, merge requests and records; {name} marks a value.
# ui:   labels of the test guide, the sprint report and the presentation.
