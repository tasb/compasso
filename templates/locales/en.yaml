  stuck_title: "Compasso: {key} does not finish"
  stuck_need: "Someone to look at why {key} does not finish, then fix the cause or change the work."
  stuck_why_count: "{key} failed {n} times in a row; the last run ended as {result}."
  stuck_why_log: "The run log is {log} on {host} ({who})."
  stuck_step_read: Read the end of the run log.
  stuck_step_fix: Fix the cause, or change the story, its assignment or its merge request.
  stuck_step_comment: If the work should move on as it is, say how in a comment.
  stuck_meanwhile: The runner skips this job and takes the next one.
  rework_footer: "Fix these blockers, push, then remove the compasso::rework label. Anything else the review saw went to the after-MVP list."
  rework_conflict: "!{mr} conflicts with {branch}: rebase it onto {branch} and push, then remove the compasso::rework label. This is not a review round."
  rework_twice_title: "Compasso: !{mr} was sent back a second time"
  rework_twice_need: "A decision on merge request !{mr}: the tech lead found blockers in it again after its rework."
  rework_twice_why: "The rework did not clear the blockers; the latest are in the tech lead's last comment on {url}"
  rework_twice_step_read: "Read the tech lead's comments on !{mr}."
  rework_twice_step_decide: "Decide: fix it yourself and push, tell the developer in a comment what to change, or close the merge request and change the story."
  rework_twice_meanwhile: The story waits; the developers and the tech lead go on with other work.
  later_title: After the MVP
  hardening_title: "Hardening: after the MVP"
  deliver_open: "Open staging: {url}"
  deliver_done: "Delivered to staging; people test it in #{ask}. A problem found there comes back as a bug."
  red_title: "Revert {sha}: {branch} is red"
  red_body: "Reverts {sha}, which turned {branch} red: {url}. Its stories go back to their developers."
  red_story: "Its merge turned {branch} red ({url}), so it was reverted in !{fix}. Fix it on a new branch and open a new merge request."
  red_ask_title: "Compasso: {branch} is red and the revert does not merge"
  red_conflict_need: "Someone to fix {branch}: {sha} turned it red, and reverting it conflicts with what was merged after it."
  red_failed_need: "Someone to fix {branch}: {sha} turned it red, and its revert !{fix} failed its pipeline too."
  red_why: "The last pipeline on {branch} failed: {url}"
  red_step_fix: "Fix {branch} on a branch of your own and open a merge request with the compasso::fix-main label."
  red_step_merge: Merge it once its pipeline is green.
  red_meanwhile: Merge requests with a green pipeline keep merging; the runner opens no other fix.
