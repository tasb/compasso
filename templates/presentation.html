<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {

  --accent: #7c9cff; --accent-soft: #1c2640; --mvp: #46c08f; --mvp-soft: #12291f; --later: #e2b45a; --later-soft: #2b2312;

:root[data-theme="dark"] {
  --bg: #0f1318; --surface: #171c23; --ink: #e8ecf1; --muted: #9aa5b4; --line: #2a313b;
  --accent: #7c9cff; --accent-soft: #1c2640; --mvp: #46c08f; --mvp-soft: #12291f; --later: #e2b45a; --later-soft: #2b2312;

nav { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }

.kicker { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
.card .sub { color: var(--muted); font-size: 14px; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-right: 6px; }
.b-mvp { background: var(--mvp-soft); color: var(--mvp); } .b-later { background: var(--later-soft); color: var(--later); }
.b-acc { background: var(--accent-soft); color: var(--accent); } .b-risk { background: var(--risk-soft); color: var(--risk); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

ul { margin: 6px 0 10px; padding-left: 20px; } li { margin: 2px 0; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; background: var(--bg); }
tr:last-child td { border-bottom: 0; }
.missing { color: var(--muted); font-style: italic; border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.diagram { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin-bottom: 14px; box-shadow: var(--shadow); }
.diagram svg { width: 100%; height: auto; display: block; }
.timeline { display: grid; gap: 12px; }
.sprint { display: grid; grid-template-columns: 110px 1fr; gap: 14px; align-items: start; }
.sprint .n { font-weight: 700; font-size: 20px; }
.sprint .n .sub { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.mvpline { border-top: 2px dashed var(--mvp); margin: 4px 0; position: relative; }
.mvpline span { position: absolute; top: -11px; left: 0; background: var(--bg); color: var(--mvp); font-size: 12px; font-weight: 700; padding: 0 6px; }
.story { border-top: 1px solid var(--line); padding: 10px 0; }
.story:first-of-type { border-top: 0; }
.story .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
a.ext { color: var(--accent); text-decoration: none; font-size: 13px; }
footer { color: var(--muted); font-size: 13px; padding: 24px 0; border-top: 1px solid var(--line); margin-top: 32px; }
@media (max-width: 720px) { .two { grid-template-columns: 1fr; } .sprint { grid-template-columns: 1fr; } h1 { font-size: 30px; } }
@media print {
  nav { display: none; } body { background: #fff; color: #000; }
  section { break-before: page; padding-top: 0; } section.cover { break-before: auto; }
  .card, .tablewrap, .diagram { box-shadow: none; break-inside: avoid; }
}
</style>
</head>
